<style>
  * {
    font-family: "Comic Neue", serif !important;
  }

  body {
    font-weight: 400;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    margin: 0;
    min-height: 100vh;
    background-color: #111;
    padding: 2em 1em;
    box-sizing: border-box;
  }

  .codeBox__wrapper {
    display: flex;
    max-width: 680px;
    width: 100%;
    flex-direction: column;
    gap: 2em;
    align-items: center;
  }

  code {
    font-weight: 800;
    user-select: none;
    pointer-events: none;
  }

  .codeBox {
    width: 100%;
    font-size: 10px;
    user-select: none;
    margin: 0 auto;
    margin-top: 20px;
  }

  .codeBox code {
    padding: 1em 0;
  }

  .copy-button {
    padding: 0.6em 1em;
    width: 100%;
    max-width: 320px;
    color: #FFFFFF;
    background-color: #222;
    border: none;
    border-radius: 1em;
    font-size: 2em;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5em;
    transition-duration: 500ms;
    text-decoration: none;
    box-sizing: border-box;
  }

  .copy-button:hover {
    background-color: #333;
  }

  .white {
    color: white;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    width: 100%;
    max-width: 980px;
    gap: 2em;
    z-index: 1;
  }

  .container header {
    font-family: "Comic Neue", serif;
    font-weight: 700;
    font-style: italic;
    color: #FFFFFF;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: row;
    gap: 1em;
  }

  .logo-text {
    font-size: 2em;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .container header>.text {
    font-size: 2em;
    color: white;
  }

  .confirm-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    color: #FFFFFF;
    justify-content: center;
    align-items: center;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition-duration: 100ms;
    background-color: #38d1d1;
    padding: 1em;
    box-sizing: border-box;
  }

  .confirm-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .confirm-box {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 2em;
    text-align: center;
  }

  .confirm-box__header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-direction: row;
    gap: 1em;
  }

  .confirm-box__header__text {
    font-size: 2em;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  .confirm-box__close {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: row;
    gap: 1em;
  }

  .confirm-box__close button {
    padding: 0.4em 1em;
    max-width: 320px;
    background-color: #FFFFFF;
    border: none;
    border-radius: 4px;
    font-size: 1.25em;
    color: #111111;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5em;
    transition-duration: 100ms;
  }

  .confirm-box__close button:hover {
    background-color: #F2F2F2;
  }

  .confirm-box__body {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 1em;
  }

  pre {
    border-radius: 1em;
    overflow: hidden !important;
  }

  .language-javascript {
    border: unset !important;
  }

  .bookmarklet-section {
    text-align: center;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1em;
    margin-top: 1em;
    border-top: 2px solid #333;
    padding-top: 2em;
    width: 100%;
  }

  .bookmarklet-section h3 {
    margin: 0;
    font-size: 1.8em;
  }

  .instructions {
    margin: 0;
    max-width: 90%;
    font-size: 1.2em;
    font-weight: 300;
  }
</style>

      </div>
    </div>
  </div>
  <div class="confirm-overlay" id="overlay">
    <div class="confirm-box">

      <div class="confirm-box__close">
        <button onclick="overlayControl('hide')">Close</button>
      </div>
      <div class="confirm-box__body">
        <div class="confirm-box__body__text">

        </div>
        <div class="confirm-box__body__text">
          <b>Make sure you are on the Instagram website before pasting the code.</b>
        </div>
      </div>
    </div>
  </div>
